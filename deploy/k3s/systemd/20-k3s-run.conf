# Installed by deploy/k3s/handover.sh pod-on; removed by pod-off. Only ExecStart changes: the job guard, central-ecu,
# the time limit and the publish step in the other drop-ins still apply.
[Service]
Environment=KUBECONFIG=%h/.kube/k3s.yaml KUBECTL=__KUBECTL__
ExecStart=
ExecStart=/usr/bin/env bash __REPO__/deploy/k3s/run-job.sh
